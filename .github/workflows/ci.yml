name: Avelang ROCm CI

on:
  push:
    branches:
      - master
      - dev-cicd
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avelang-gfx950-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test on gfx950
    runs-on:
      - self-hosted
      - linux
      - x64
      - rocm
      - gfx950
    timeout-minutes: 60

    env:
      AMDGPU_TARGETS: gfx950
      PYTORCH_ROCM_ARCH: gfx950
      BUILD_DIR: build/ci
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: 5G

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Initialize cache locations
        id: cache-paths
        shell: bash
        run: |
          ccache_dir="$RUNNER_TEMP/avelang-ci-cache/ccache"
          hunter_root="$RUNNER_TEMP/avelang-ci-cache/hunter"
          echo "ccache=$ccache_dir" >> "$GITHUB_OUTPUT"
          echo "hunter=$hunter_root" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$ccache_dir" >> "$GITHUB_ENV"
          echo "HUNTER_ROOT=$hunter_root" >> "$GITHUB_ENV"

      - name: Restore compiler and dependency caches
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.cache-paths.outputs.ccache }}
            ${{ steps.cache-paths.outputs.hunter }}
          key: avelang-${{ runner.os }}-${{ runner.arch }}-${{ env.AMDGPU_TARGETS }}-${{ hashFiles('ci/image.env', 'ci/apt-packages.txt', 'ci/requirements-ci.txt', 'CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: avelang-${{ runner.os }}-${{ runner.arch }}-${{ env.AMDGPU_TARGETS }}-${{ hashFiles('ci/image.env', 'ci/apt-packages.txt', 'ci/requirements-ci.txt', 'CMakeLists.txt', 'cmake/**') }}-

      - name: Configure runner environment
        shell: bash
        run: |
          echo "/opt/llvm23/bin" >> "$GITHUB_PATH"
          echo "/opt/venv/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/python" >> "$GITHUB_ENV"
          mkdir -p "$CCACHE_DIR" "$HUNTER_ROOT"
          ccache --zero-stats
          ccache --set-config="cache_dir=$CCACHE_DIR"
          ccache --set-config="base_dir=$CCACHE_BASEDIR"
          ccache --set-config="compiler_check=$CCACHE_COMPILERCHECK"
          ccache --set-config="hash_dir=false"
          ccache --set-config="max_size=$CCACHE_MAXSIZE"

      - name: Verify ROCm and LLVM environment
        shell: bash
        run: |
          llvm-config --version
          llvm-config --targets-built
          hipcc --version
          rocminfo | grep -m1 gfx950
          python -c "import torch; assert torch.version.hip; assert torch.cuda.is_available(); print(torch.__version__, torch.version.hip, torch.cuda.get_device_name(0))"

      - name: Configure CMake
        shell: bash
        run: |
          rm -rf "$BUILD_DIR"
          rocm_prefix="$(hipconfig --rocmpath)"
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAVE_LANG_BACKEND=rocm \
            -DWITH_PYTHON=ON \
            -DCMAKE_C_COMPILER=/opt/llvm23/bin/clang \
            -DCMAKE_CXX_COMPILER=/opt/llvm23/bin/clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="/opt/llvm23;${rocm_prefix}" \
            -DCMAKE_EXE_LINKER_FLAGS='-Wl,--exclude-libs,ALL' \
            -DCMAKE_MODULE_LINKER_FLAGS='-Wl,--exclude-libs,ALL' \
            -DHUNTER_ROOT="$HUNTER_ROOT" \
            -DPython3_ROOT_DIR=/opt/venv \
            -DPython3_EXECUTABLE=/opt/venv/bin/python \
            -DAVE_LANG_PYTHON_LIBRARY_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/python"

      - name: Build with Ninja
        shell: bash
        run: ninja -C "$BUILD_DIR" -j"$(nproc)"

      - name: Run native tests
        shell: bash
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure --parallel "$(nproc)"

      - name: Prepare source-tree Python package
        shell: bash
        run: python setup.py egg_info --egg-base python

      - name: Run Python functionality tests
        shell: bash
        run: python -m pytest -q -ra test/

      - name: Report compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats --verbose
